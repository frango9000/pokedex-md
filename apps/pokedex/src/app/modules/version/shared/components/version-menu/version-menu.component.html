<ng-container *transloco="let t; prefix: 'version'">
  <button mat-button [matMenuTriggerFor]="menu">{{ t((version$ | async)?.name + '') }}</button>
  <mat-menu #menu="matMenu">
    @for (version of versions$ | async; track version.id) {
      <button mat-menu-item (click)="version$.next(version)">
        {{ t(version.name) }}
      </button>
    }
  </mat-menu>
</ng-container>
