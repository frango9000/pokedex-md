<ng-container *transloco="let t; prefix: 'api.version-group'">
  <button mat-button [matMenuTriggerFor]="menu">{{ t((versionGroup$ | async)?.name + '') }}</button>
  <mat-menu #menu="matMenu">
    @for (versionGroup of versionsGroups$ | async; track versionGroup.id) {
      <button mat-menu-item (click)="versionGroup$.next(versionGroup)">
        {{ t(versionGroup.name) }}
      </button>
    }
  </mat-menu>
</ng-container>
