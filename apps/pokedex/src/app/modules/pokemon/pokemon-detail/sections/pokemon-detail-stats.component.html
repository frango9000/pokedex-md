@if (pokemon) {
  <div class="mat-table mat-static-table">
    <mat-divider></mat-divider>
    <div class="mat-header-row" *transloco="let t; prefix: 'ui.pokemon.detail.stats'">
      <div class="mat-header-cell">{{ t('stat') }}</div>
      <div class="mat-header-cell">{{ t('base') }}</div>
      <div class="mat-header-cell">{{ t('ev') }}</div>
    </div>
    @for (stat of pokemon.stats; track stat) {
      <mat-divider></mat-divider>
      <div class="mat-row" *transloco="let t; prefix: 'stat'">
        <div class="mat-cell">{{ t(stat.stat.name) }}</div>
        <div class="mat-cell">{{ stat.base_stat }}</div>
        <div class="mat-cell">{{ stat.effort }}</div>
      </div>
    }
  </div>
}
