name: Delete Api Branches

on:
  workflow_dispatch:
  push:
    branches:
      - copilot/delete-branches-starting-with-api

permissions:
  contents: write
  pull-requests: write

jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Delete all api/* branches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git ls-remote --heads origin 'api/*' | awk '{print $2}' | sed 's|refs/heads/||' | while read -r branch; do
            gh pr list --head "$branch" --state open --json number --jq '.[].number' | xargs -r -I{} gh pr close {} --comment "Superseded by new weekly API build" || true
            git push origin --delete "$branch" || true
          done
