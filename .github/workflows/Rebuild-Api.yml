name: Rebuild Api

on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 4'

permissions:
  contents: write
  pull-requests: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Use Node 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Cache Node modules
        uses: actions/cache@v5
        with:
          path: ./node_modules
          key: yarn-v5-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            yarn-v5-${{ runner.os }}-

      - name: Yarn Install
        run: yarn install

      - name: Build
        run: |
          yarn build:api
          yarn format:all

      - name: Check for changes
        id: git_diff_check
        run: |
          git fetch origin
          git diff --quiet origin/development || echo "changes=true" >> $GITHUB_OUTPUT

      - name: Commit and push if there were changes
        if: steps.git_diff_check.outputs.changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "Poke Bot"
          git config user.email "frango9000@users.noreply.github.com"
          git ls-remote --heads origin 'api/*' | awk '{print $2}' | sed 's|refs/heads/||' | while read -r branch; do
            gh pr list --head "$branch" --state open --json number --jq '.[].number' | xargs -r -I{} gh pr close {} --comment "Superseded by new weekly API build" || true
            git push origin --delete "$branch" || true
          done
          CURRENT_BRANCH=api/$(date +%Y-%U)
          git checkout -b $CURRENT_BRANCH
          git add ./apps/pokedex/src/assets/api
          git commit -m "Chore(api): $CURRENT_BRANCH"
          git push -f origin $CURRENT_BRANCH
          gh pr create --base development --title "Chore(api): $CURRENT_BRANCH" --body "Chore(api): $CURRENT_BRANCH"
